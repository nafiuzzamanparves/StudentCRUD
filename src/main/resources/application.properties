spring.application.name=STUDENT-CRUD
server.port=8081
spring.profiles.active=prod
# Database confituration (Comment)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/ORCLPDB
spring.datasource.username=orclpdbuser
spring.datasource.password=isdb62
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
#spring.datasource.driver-class-name=org.postgresql.Driver # PostgreSQL

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.banner.location=classpath:banner.txt

# Spring boot actuator
management.endpoints.web.exposure.include=*

# SpringDoc properties
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.deepLinking=true
springdoc.default-produces-media-type=application/json
springdoc.show-actuator=true
#springdoc.packages-to-scan=com.example.controller
#springdoc.paths-to-match=/api/**,/management/**,/public/**